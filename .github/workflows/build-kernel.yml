name: Build Bitra Kernel with NoMount, SuSFS & APatch

on:
  workflow_dispatch:
    inputs:
      superkey:
        description: 'APatch SuperKey'
        required: false
        default: 'AntigravityRoot'
      branch:
        description: 'Kernel branch'
        required: true
        default: 'master'
  push:
    branches:
      - master

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates ccache clang curl flex git \
          gnupg libelf-dev libssl-dev libtinfo5 libncurses5 lz4 make python3 python-is-python3 unzip zip

    - name: Download Toolchains
      run: |
        mkdir -p toolchains
        cd toolchains
        
        # Download Android Clang 10.0.7 (r383902) via sparse checkout
        echo "Downloading Android Clang 10.0.7 (r383902)..."
        git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release clang_repo
        (cd clang_repo && git sparse-checkout set clang-r383902)
        mv clang_repo/clang-r383902 clang
        rm -rf clang_repo
        
        # Download AArch64 GCC 4.9
        echo "Downloading AArch64 GCC 4.9 (android10-release)..."
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android10-release gcc-arm64
        
        # Download ARM32 GCC 4.9 (for compat vdso)
        echo "Downloading ARM32 GCC 4.9 (android10-release)..."
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android10-release gcc-arm

    - name: Clone Realme GT Neo 2 Kernel Source
      run: |
        BRANCH="${{ github.event.inputs.branch || 'master' }}"
        echo "Cloning Realme GT Neo 2 Kernel source (branch: $BRANCH)..."
        git clone --depth=1 https://github.com/realme-kernel-opensource/realme_GTneo2-Q5pro-GTMasterExploratory-AndroidT-kernel-source -b "$BRANCH" kernel_src

    - name: Apply NoMount & SuSFS Patches
      run: |
        cd kernel_src
        
        # 1. Apply OEM fixes and universal Kconfig cleanup via python helper
        python3 ../patch_kconfigs.py
        
        # 2. Apply NoMount built-in driver
        echo "Applying NoMount integration..."
        curl -s https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s -- dev
        
        # 3. Check if SuSFS patch exists and apply
        if [ -f "../50_add_susfs_in_kernel-4.19.patch" ]; then
          echo "Applying SuSFS 4.19 patch..."
          patch -p1 < ../50_add_susfs_in_kernel-4.19.patch || true
          [ -f "../fs/susfs.c" ] && cp ../fs/susfs.c fs/
          [ -f "../include/linux/susfs.h" ] && cp ../include/linux/susfs.h include/linux/
          [ -f "../include/linux/susfs_def.h" ] && cp ../include/linux/susfs_def.h include/linux/
          [ -f "../include/linux/sus_su.h" ] && cp ../include/linux/sus_su.h include/linux/
        fi
        
        # 4. Conceal NoMount symbols in kallsyms
        if grep -q "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS" kernel/kallsyms.c; then
          sed -i 's/!strncmp(iter->name, "ksud", 4)/!strncmp(iter->name, "ksud", 4) || !strncmp(iter->name, "nm_", 3) || !strncmp(iter->name, "nomount_", 8)/g' kernel/kallsyms.c
        fi

    - name: Configure Kernel Defconfig
      run: |
        cd kernel_src
        DEFCONFIG=vendor/kona-perf_defconfig
        [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG=vendor/kona_defconfig
        
        # Enable NoMount and Required Features
        echo "CONFIG_64BIT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KEYS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KEYS_COMPAT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/$DEFCONFIG
        
        # Disable proprietary unbuildable VL53L1 laser sensor
        sed -i '/CONFIG_STMVL53L1/d' arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_STMVL53L1=n" >> arch/arm64/configs/$DEFCONFIG
        
        # Disable proprietary unbuildable UFSFEATURE add-on
        sed -i '/CONFIG_UFSFEATURE/d' arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_UFSFEATURE=n" >> arch/arm64/configs/$DEFCONFIG
        sed -i '/CONFIG_UFSHPB/d' arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_UFSHPB=n" >> arch/arm64/configs/$DEFCONFIG
        sed -i '/CONFIG_UFSTW/d' arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_UFSTW=n" >> arch/arm64/configs/$DEFCONFIG
        sed -i '/CONFIG_UFSHID/d' arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_UFSHID=n" >> arch/arm64/configs/$DEFCONFIG
        
        # Enable SuSFS
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/$DEFCONFIG

    - name: Compile Kernel
      run: |
        cd kernel_src
        export PATH="$(pwd)/../toolchains/clang/bin:$(pwd)/../toolchains/gcc-arm64/bin:$(pwd)/../toolchains/gcc-arm/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        DEFCONFIG=vendor/kona-perf_defconfig
        [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG=vendor/kona_defconfig
        
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- $DEFCONFIG
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- Image dtbs

    - name: Patch Kernel with APatch kptools
      run: |
        IMAGE=kernel_src/out/arch/arm64/boot/Image
        cp "$IMAGE" Image.unpatched
        
        SUPERKEY="${{ github.event.inputs.superkey || 'AntigravityRoot' }}"
        if [ -n "$SUPERKEY" ]; then
          echo "Patching Image with APatch kptools (SuperKey: $SUPERKEY)..."
          git clone --depth=1 https://github.com/bmax121/KernelPatch -b 0.13.9 kp_src
          cp -f kp_src/kernel/include/preset.h kp_src/tools/
          make -C kp_src/tools -j$(nproc)
          curl -sLO https://github.com/bmax121/KernelPatch/releases/download/0.13.9/kpimg-android
          ./kp_src/tools/kptools -p -i "$IMAGE" -k kpimg-android -s "$SUPERKEY" -o Image.patched
          mv Image.patched "$IMAGE"
          echo "Kernel successfully pre-patched with APatch!"
        fi

    - name: Package AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master anykernel
        rm -rf anykernel/.git
        
        # Copy compiled Image and DTB
        cp kernel_src/out/arch/arm64/boot/Image anykernel/
        [ -f kernel_src/out/arch/arm64/boot/dtb ] && cp kernel_src/out/arch/arm64/boot/dtb anykernel/
        
        # Copy custom AnyKernel3 config
        [ -f anykernel.sh ] && cp anykernel.sh anykernel/anykernel.sh
        
        cd anykernel
        zip -r9 ../AnyKernel3-NoMount-bitra.zip * -x README.md

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-NoMount-bitra
        path: |
          AnyKernel3-NoMount-bitra.zip
          Image.unpatched